<!DOCTYPE html>

{% load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" href="{% static 'gridmap/ol/ol.css' %}">
    <style  type="text/css">
		html, body {
		  height: 100%;
		  width: 100%;
		  margin: 0px;
		  padding: 0px;
		}

		.map {
		  height: 100%;
		}
	</style>

    <script src="{% static 'gridmap/ol/dist/ol.js' %}"></script>

</head>
<body>
    <div class="container"></div>
        <div id="ol-map" class="map"></div>

    <script>
		function init(){
			var map = new ol.Map({
			  target: 'ol-map',
			  layers: [
				new ol.layer.Tile({
				  source: new ol.source.OSM()
				})
			  ],
			  view: new ol.View({
				center: ol.proj.fromLonLat([33.82, -13.91]),
				zoom: 7
			  })
    		});
		}

		init()
	</script>

</body>
</html>
